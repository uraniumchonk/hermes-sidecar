  <path d="M51 34 L46 5 L30 25 Z" fill="#2fbf8f"/>
  <!-- cloud body -->
  <g fill="#34d399">
    <circle cx="20" cy="39" r="14"/>
    <circle cx="34" cy="32" r="16"/>
    <circle cx="46" cy="39" r="13"/>
    <rect x="11" y="39" width="42" height="14" rx="7"/>
  </g>
  <!-- face -->
  <g fill="#0f2e24">
    <circle cx="26" cy="41" r="3.2"/>
    <circle cx="42" cy="41" r="3.2"/>
  </g>
  <path d="M30.5 46 Q34 49.5 37.5 46" stroke="#0f2e24" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="20.5" cy="45" r="2.8" fill="#fb7ba8" opacity="0.8"/>
  <circle cx="47.5" cy="45" r="2.8" fill="#fb7ba8" opacity="0.8"/>
